name: CI and Android APK

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name desa_ai .
      - name: Set the registered Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text()
          source, namespace_count = re.subn(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.desaai.app"', source, count=1)
          source, app_count = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.desaai.app"', source, count=1)
          if namespace_count != 1 or app_count != 1:
              raise SystemExit("Could not set Android namespace/applicationId")
          gradle.write_text(source)
          # Apply Firebase Google Services plugin to the generated Android scaffold.
          settings = Path("android/settings.gradle.kts")
          settings_source = settings.read_text()
          if "com.google.gms.google-services" not in settings_source:
              settings_source = settings_source.replace("plugins {", "plugins {" + chr(10) + '    id("com.google.gms.google-services") version "4.4.2" apply false', 1)
          settings.write_text(settings_source)
          app_gradle = Path("android/app/build.gradle.kts")
          app_source = app_gradle.read_text()
          if "id(\\\"com.google.gms.google-services\\\")" not in app_source:
              app_source = app_source.replace("plugins {", "plugins {" + chr(10) + '    id("com.google.gms.google-services")', 1)
          app_gradle.write_text(app_source)
          import json
          config = json.loads(Path("android/app/google-services.json").read_text())
          if not any(x.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.desaai.app" for x in config.get("client", [])):
              raise SystemExit("google-services.json does not contain Android package com.desaai.app")
          PY
      - name: Remove generated counter-app test
        run: rm -f test/widget_test.dart
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Check production release configuration
        id: release_config
        if: github.event_name != 'pull_request'
        env:
          DESAAI_API_BASE_URL: ${{ secrets.DESAAI_API_BASE_URL }}
          DESAAI_KEYSTORE_BASE64: ${{ secrets.DESAAI_KEYSTORE_BASE64 }}
          DESAAI_KEYSTORE_PASSWORD: ${{ secrets.DESAAI_KEYSTORE_PASSWORD }}
          DESAAI_KEY_ALIAS: ${{ secrets.DESAAI_KEY_ALIAS }}
          DESAAI_KEY_PASSWORD: ${{ secrets.DESAAI_KEY_PASSWORD }}
        run: |
          if [ -z "$DESAAI_API_BASE_URL" ] || [ -z "$DESAAI_KEYSTORE_BASE64" ] || [ -z "$DESAAI_KEYSTORE_PASSWORD" ] || [ -z "$DESAAI_KEY_ALIAS" ] || [ -z "$DESAAI_KEY_PASSWORD" ]; then
            echo "::warning::Release APK skipped. Configure DESAAI_API_BASE_URL and all four DESAAI signing secrets."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$DESAAI_API_BASE_URL" in https://*) ;; *) echo "DESAAI_API_BASE_URL must use HTTPS"; exit 1 ;; esac
          echo "$DESAAI_KEYSTORE_BASE64" | base64 --decode > android/app/desaai-release.jks
          keytool -list -v -keystore android/app/desaai-release.jks -storepass "$DESAAI_KEYSTORE_PASSWORD" -alias "$DESAAI_KEY_ALIAS" > /tmp/desaai-signing.txt
          SIGNING_SHA1="$(awk -F': ' '/SHA1:/{print $2; exit}' /tmp/desaai-signing.txt | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          python3 - "$SIGNING_SHA1" <<'PY'
          import json, sys
          from pathlib import Path
          wanted = sys.argv[1]
          data = json.loads(Path("android/app/google-services.json").read_text())
          registered = {
              str(o.get("android_info", {}).get("certificate_hash", "")).replace(":", "").lower()
              for c in data.get("client", []) for o in c.get("oauth_client", [])
              if o.get("client_type") == 1
          }
          if not wanted or wanted not in registered:
              raise SystemExit("Signing SHA-1 is not registered in google-services.json. Add it to Firebase Android app, then download the updated google-services.json.")
          print("Google OAuth signing SHA-1 matches Firebase Android client.")
          PY
          cat > android/key.properties <<EOF
          storeFile=desaai-release.jks
          storePassword=$DESAAI_KEYSTORE_PASSWORD
          keyAlias=$DESAAI_KEY_ALIAS
          keyPassword=$DESAAI_KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text()
          if "import java.util.Properties" not in source:
              source = "import java.util.Properties\nimport java.io.FileInputStream\n" + source
          if 'create("desaAiRelease")' not in source:
              signing = '''
              val signingProperties = Properties().apply {
                  load(FileInputStream(rootProject.file("key.properties")))
              }
              signingConfigs {
                  create("desaAiRelease") {
                      storeFile = file(signingProperties["storeFile"] as String)
                      storePassword = signingProperties["storePassword"] as String
                      keyAlias = signingProperties["keyAlias"] as String
                      keyPassword = signingProperties["keyPassword"] as String
                  }
              }
          '''
              source, count = re.subn(r'(?m)^(android\s*\{)', r'\1\n' + signing, source, count=1)
              if count != 1:
                  raise SystemExit("Could not insert permanent signing config inside android block")
          source, count = re.subn(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                                 'signingConfig = signingConfigs.getByName("desaAiRelease")', source, count=1)
          if count != 1:
              raise SystemExit("Could not bind release build to permanent signing key")
          gradle.write_text(source)
          PY
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Build signed split release APKs
        if: steps.release_config.outputs.configured == 'true'
        env:
          DESAAI_API_BASE_URL: ${{ secrets.DESAAI_API_BASE_URL }}
        run: flutter build apk --release --split-per-abi --dart-define=DESA_AI_API_URL="$DESAAI_API_BASE_URL"
      - name: Verify release APK signatures
        if: steps.release_config.outputs.configured == 'true'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "=== $apk ==="
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
      - name: Upload signed release APKs
        if: steps.release_config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desa-ai-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend syntax and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Lint backend
        run: npm run lint
      - name: Test financial transactions in Firestore Emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-desa-ai-p0 --config ../firebase.json "npm run test:emulator"
