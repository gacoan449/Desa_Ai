name: CI and Android APK

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and Android release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android platform files for CI
        run: flutter create --platforms=android --project-name desa_ai .
      - name: Configure permanent release signing (when GitHub secrets are set)
        env:
          DESAAI_KEYSTORE_BASE64: ${{ secrets.DESAAI_KEYSTORE_BASE64 }}
          DESAAI_KEYSTORE_PASSWORD: ${{ secrets.DESAAI_KEYSTORE_PASSWORD }}
          DESAAI_KEY_ALIAS: ${{ secrets.DESAAI_KEY_ALIAS }}
          DESAAI_KEY_PASSWORD: ${{ secrets.DESAAI_KEY_PASSWORD }}
        run: |
          if [ -z "$DESAAI_KEYSTORE_BASE64" ]; then
            echo "Permanent release key not configured; using Flutter's default signing for this build."
            exit 0
          fi
          test -n "$DESAAI_KEYSTORE_PASSWORD"
          test -n "$DESAAI_KEY_ALIAS"
          test -n "$DESAAI_KEY_PASSWORD"
          echo "$DESAAI_KEYSTORE_BASE64" | base64 --decode > android/app/desaai-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import os
          import re
          # Keep signing values in a runner-local, base64-encoded Gradle properties file.
          props = Path("android/gradle.properties")
          with props.open("a") as out:
              for key in ("DESAAI_KEYSTORE_PASSWORD", "DESAAI_KEY_ALIAS", "DESAAI_KEY_PASSWORD"):
                  value = base64.b64encode(os.environ[key].encode()).decode()
                  out.write("\n" + key + "_B64=" + value + "\n")
          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Could not find android/app/build.gradle(.kts)")
          s = gradle.read_text()
          if gradle.suffix == ".kts":
              if "import java.util.Base64" not in s:
                  s = "import java.util.Base64" + chr(10) + "import java.nio.charset.StandardCharsets" + chr(10) + s
              signing = '''
              signingConfigs {
                  create("desaAiRelease") {
                      storeFile = file("desaai-release.jks")
                      storePassword = String(Base64.getDecoder().decode(project.property("DESAAI_KEYSTORE_PASSWORD_B64") as String), StandardCharsets.UTF_8)
                      keyAlias = String(Base64.getDecoder().decode(project.property("DESAAI_KEY_ALIAS_B64") as String), StandardCharsets.UTF_8)
                      keyPassword = String(Base64.getDecoder().decode(project.property("DESAAI_KEY_PASSWORD_B64") as String), StandardCharsets.UTF_8)
                  }
              }
          '''
              if 'create("desaAiRelease")' not in s:
                  s, n = re.subn(r'(?m)^([ \t]*)buildTypes\s*\{', signing + r'\n\1buildTypes {', s, count=1)
                  if n != 1:
                      raise SystemExit("Could not add release signing config to Kotlin Gradle file")
              s = s.replace('signingConfig = signingConfigs.getByName("debug")',
                            'signingConfig = signingConfigs.getByName("desaAiRelease")')
          else:
              signing = '''
              signingConfigs {
                  desaAiRelease {
                      storeFile file("desaai-release.jks")
                      storePassword new String(Base64.decoder.decode(project.property("DESAAI_KEYSTORE_PASSWORD_B64")), "UTF-8")
                      keyAlias new String(Base64.decoder.decode(project.property("DESAAI_KEY_ALIAS_B64")), "UTF-8")
                      keyPassword new String(Base64.decoder.decode(project.property("DESAAI_KEY_PASSWORD_B64")), "UTF-8")
                  }
              }
          '''
              if "desaAiRelease {" not in s:
                  s, n = re.subn(r'(?m)^([ \t]*)buildTypes\s*\{', signing + r'\n\1buildTypes {', s, count=1)
                  if n != 1:
                      raise SystemExit("Could not add release signing config to Groovy Gradle file")
              s = s.replace('signingConfig signingConfigs.debug',
                            'signingConfig signingConfigs.desaAiRelease')
          gradle.write_text(s)
          print(f"Configured permanent release signing in {gradle}")
          PY
      - name: Remove generated counter-app test
        run: rm -f test/widget_test.dart
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --dart-define=DESA_AI_API_URL=https://example.invalid
      - name: Print actual APK signing certificate fingerprints
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "=== $apk ==="
            "$APKSIGNER" verify --print-certs "$apk"
          done
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: desa-ai-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend syntax and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Lint backend
        run: npm run lint
