name: CI and Android APK

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name desa_ai .
      - name: Set the registered Android application ID
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle.kts")
          if not gradle.exists():
              raise SystemExit("Expected Kotlin Gradle file was not generated")
          source = gradle.read_text()
          source, namespace_count = re.subn(r'namespace\s*=\s*"[^"]+"', 'namespace = "com.desaai.app"', source, count=1)
          source, app_count = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.desaai.app"', source, count=1)
          if namespace_count != 1 or app_count != 1:
              raise SystemExit("Could not set Android namespace/applicationId")
          gradle.write_text(source)
          PY
      - name: Remove generated counter-app test
        run: rm -f test/widget_test.dart
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Require production release configuration
        if: github.event_name != 'pull_request'
        env:
          DESAAI_API_BASE_URL: ${{ secrets.DESAAI_API_BASE_URL }}
          DESAAI_KEYSTORE_BASE64: ${{ secrets.DESAAI_KEYSTORE_BASE64 }}
          DESAAI_KEYSTORE_PASSWORD: ${{ secrets.DESAAI_KEYSTORE_PASSWORD }}
          DESAAI_KEY_ALIAS: ${{ secrets.DESAAI_KEY_ALIAS }}
          DESAAI_KEY_PASSWORD: ${{ secrets.DESAAI_KEY_PASSWORD }}
        run: |
          test -n "$DESAAI_API_BASE_URL" || { echo "Missing DESAAI_API_BASE_URL secret"; exit 1; }
          case "$DESAAI_API_BASE_URL" in https://*) ;; *) echo "DESAAI_API_BASE_URL must use HTTPS"; exit 1 ;; esac
          test -n "$DESAAI_KEYSTORE_BASE64" || { echo "Missing DESAAI_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$DESAAI_KEYSTORE_PASSWORD" || { echo "Missing DESAAI_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$DESAAI_KEY_ALIAS" || { echo "Missing DESAAI_KEY_ALIAS secret"; exit 1; }
          test -n "$DESAAI_KEY_PASSWORD" || { echo "Missing DESAAI_KEY_PASSWORD secret"; exit 1; }
          echo "$DESAAI_KEYSTORE_BASE64" | base64 --decode > android/app/desaai-release.jks
          keytool -list -keystore android/app/desaai-release.jks -storepass "$DESAAI_KEYSTORE_PASSWORD" -alias "$DESAAI_KEY_ALIAS" >/dev/null
          cat > android/key.properties <<EOF
          storeFile=app/desaai-release.jks
          storePassword=$DESAAI_KEYSTORE_PASSWORD
          keyAlias=$DESAAI_KEY_ALIAS
          keyPassword=$DESAAI_KEY_PASSWORD
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("android/app/build.gradle.kts")
          source = gradle.read_text()
          if "import java.util.Properties" not in source:
              source = "import java.util.Properties\nimport java.io.FileInputStream\n" + source
          if 'create("desaAiRelease")' not in source:
              signing = '''
          val signingProperties = Properties().apply {
              load(FileInputStream(rootProject.file("key.properties")))
          }
          '''
              source = signing + source
              block = '''
              signingConfigs {
                  create("desaAiRelease") {
                      storeFile = file(signingProperties["storeFile"] as String)
                      storePassword = signingProperties["storePassword"] as String
                      keyAlias = signingProperties["keyAlias"] as String
                      keyPassword = signingProperties["keyPassword"] as String
                  }
              }
          '''
              source, count = re.subn(r'(?m)^([ \t]*)buildTypes\s*\{', block + r'\n\1buildTypes {', source, count=1)
              if count != 1:
                  raise SystemExit("Could not insert permanent signing config")
          source, count = re.subn(r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
                                 'signingConfig = signingConfigs.getByName("desaAiRelease")', source, count=1)
          if count != 1:
              raise SystemExit("Could not bind release build to permanent signing key")
          gradle.write_text(source)
          PY
      - name: Build signed split release APKs
        if: github.event_name != 'pull_request'
        env:
          DESAAI_API_BASE_URL: ${{ secrets.DESAAI_API_BASE_URL }}
        run: flutter build apk --release --split-per-abi --dart-define=DESA_AI_API_URL="$DESAAI_API_BASE_URL"
      - name: Verify release APK signatures
        if: github.event_name != 'pull_request'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "=== $apk ==="
            "$APKSIGNER" verify --verbose --print-certs "$apk"
          done
      - name: Upload signed release APKs
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: desa-ai-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend syntax and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Lint backend
        run: npm run lint
