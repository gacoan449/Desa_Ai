name: CI and Android APK

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and Android release APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate Android platform files for CI
        run: flutter create --platforms=android --project-name desa_ai .
      - name: Remove generated counter-app test
        run: rm -f test/widget_test.dart
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Build split release APKs
        run: flutter build apk --release --split-per-abi --dart-define=DESA_AI_API_URL=https://example.invalid
      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: desa-ai-release-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 7

  backend:
    name: Backend syntax and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: npm run check
      - name: Lint backend
        run: npm run lint
