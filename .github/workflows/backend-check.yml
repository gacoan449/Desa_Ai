name: Backend checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze and Android build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --platforms=android --project-name desa_ai .
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter build apk --debug

  backend:
    name: Backend syntax and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: functions
      - run: npm run check
        working-directory: functions
      - run: npm run lint
        working-directory: functions
